<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Викторина: Арабский алфавит на слух</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060913;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-highlight: rgba(255, 255, 255, 0.05);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --btn-surface: rgba(255, 255, 255, 0.04);
      --btn-surface-hover: rgba(255, 255, 255, 0.08);
      --btn-border: rgba(255, 255, 255, 0.1);
      --success-surface: rgba(34, 197, 94, 0.16);
      --success-border: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.35);
      --error-surface: rgba(239, 68, 68, 0.16);
      --error-border: #ef4444;
      --error-glow: rgba(239, 68, 68, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Фоновые акценты */
    .glow-blob {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
    }
    .blob-2 {
      background: radial-gradient(circle, #4f46e5, transparent 70%);
      bottom: 5%;
      right: 10%;
    }

    /* Основной контейнер */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 640px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 36px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.85),
        0 0 0 1px var(--card-highlight) inset;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hidden {
      display: none !important;
    }

    /* ========================================================
       ЧЕТКИЙ И СТИЛЬНЫЙ СТАРТОВЫЙ ЭКРАН
    ======================================================== */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 8px 6px;
    }

    .start-badge-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .start-icon-box {
      width: 92px;
      height: 92px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(37, 99, 235, 0.1));
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(56, 189, 248, 0.2) inset;
      position: relative;
    }

    .start-arabic-char {
      font-family: 'Amiri', serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      transform: translateY(-2px);
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .start-sound-tag {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 32px;
      height: 32px;
      background: #0f172a;
      border: 1.5px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .start-sound-tag svg {
      width: 16px;
      height: 16px;
      fill: var(--primary);
    }

    .start-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .start-desc {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text-sub);
      max-width: 300px;
      margin-bottom: 24px;
      font-weight: 500;
    }

    /* Информационные чипы */
    .start-chips {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .start-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .start-chip.active {
      color: var(--primary);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
    }

    .primary-btn {
      width: 100%;
      max-width: 270px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 18px;
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 12px 28px var(--primary-glow);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 36px rgba(56, 189, 248, 0.55);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    /* ========================================================
       ЭКРАН ВИКТОРИНЫ
    ======================================================== */
    .header {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .counter-pill {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .score-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
      border-radius: 999px;
      box-shadow: 0 0 12px var(--primary-glow);
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .audio-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
    }

    .waves-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      height: 140px;
    }

    .wave-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.25);
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    .playing .wave-ring:nth-child(1) {
      animation: ripple 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }
    .playing .wave-ring:nth-child(2) {
      animation: ripple 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1) 0.6s;
    }

    @keyframes ripple {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .listen-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--primary-gradient);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px var(--primary-glow);
      transition: all 0.22s ease;
      z-index: 2;
    }

    .listen-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 16px 36px rgba(56, 189, 248, 0.55);
    }

    .listen-btn:active {
      transform: scale(0.94);
    }

    .listen-btn svg {
      width: 36px;
      height: 36px;
      fill: currentColor;
    }

    .listen-hint {
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .option-btn {
      aspect-ratio: 1 / 1;
      width: 100%;
      background: var(--btn-surface);
      border: 1px solid var(--btn-border);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      color: var(--text-main);
      font-family: 'Amiri', serif;
      font-size: 2.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      unicode-bidi: isolate;
      padding-bottom: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .option-btn:hover:not(:disabled) {
      background: var(--btn-surface-hover);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.96) translateY(0);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--success-surface) !important;
      border-color: var(--success-border) !important;
      color: var(--success-border) !important;
      box-shadow: 0 0 25px var(--success-glow) !important;
      transform: scale(1.02);
    }

    .option-btn.wrong {
      background: var(--error-surface) !important;
      border-color: var(--error-border) !important;
      color: var(--error-border) !important;
      box-shadow: 0 0 25px var(--error-glow) !important;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    /* ========================================================
       ЭКРАН РЕЗУЛЬТАТОВ
    ======================================================== */
    .result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 12px 6px;
    }

    .result-score {
      font-size: 3.8rem;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0 12px 0;
      letter-spacing: -1.5px;
      text-shadow: 0 0 24px var(--primary-glow);
    }
    
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="app-container">
    
    <!-- 1. Четкий стартовый экран -->
    <div class="screen start-screen" id="start-block">
      <div class="start-badge-wrapper">
        <div class="start-icon-box">
          <span class="start-arabic-char">ض</span>
        </div>
        <div class="start-sound-tag" title="Аудиовикторина">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
      </div>

      <h1 class="start-title">Арабская фонетика</h1>
      <p class="start-desc">Слушайте правильное произношение букв и определяйте соответствующий символ.</p>
      
      <div class="start-chips">
        <span class="start-chip active">29 букв</span>
        <span class="start-chip">Аудио HD</span>
        <span class="start-chip">4 варианта</span>
      </div>

      <button class="primary-btn" id="start-btn">Начать викторину</button>
    </div>

    <!-- 2. Викторина -->
    <div class="screen hidden" id="quiz-block">
      <div class="header">
        <div class="top-bar">
          <span class="counter-pill" id="question-counter">Вопрос 1/10</span>
          <div class="score-badge">
            <div class="score-dot"></div>
            <span id="score-counter">Очки: 0</span>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="audio-section">
        <div class="waves-container" id="waves-container">
          <div class="wave-ring"></div>
          <div class="wave-ring"></div>
          <button class="listen-btn" id="listen-btn" aria-label="Прослушать произношение буквы" title="Воспроизвести звук">
            <svg viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
        <div class="listen-hint">Нажмите для повтора звука</div>
      </div>

      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 3. Экран результатов -->
    <div class="screen result-screen hidden" id="result-block">
      <h2 style="font-size: 1.6rem; font-weight: 800;">Раунд завершён</h2>
      <p style="color: var(--text-muted); margin-top: 6px;">Количество точных ответов:</p>
      <div class="result-score" id="final-score">0 / 10</div>
      <p id="result-message" style="color: var(--text-sub); font-size: 0.95rem; max-width: 280px;"></p>
      <button class="primary-btn" id="restart-btn" style="margin-top: 24px;">Пройти ещё раз</button>
    </div>

  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    /* ========================================================================
       БАЗА БУКВ И АУДИОФАЙЛОВ[span_1](start_span)[span_1](end_span)
    ======================================================================== */
    const AUDIO_DATABASE = [
      { id: 'alif',  letter: 'ا', audio: 'audio/001-alif.mp3' },
      { id: 'baa',   letter: 'ب', audio: 'audio/002-ba.mp3' },
      { id: 'taa',   letter: 'ت', audio: 'audio/003-taa.mp3' },
      { id: 'thaa',  letter: 'ث', audio: 'audio/004-tha.mp3' },
      { id: 'jeem',  letter: 'ج', audio: 'audio/005-jeem.mp3' },
      { id: 'haa',   letter: 'ح', audio: 'audio/006-haa.mp3' },
      { id: 'khaa',  letter: 'خ', audio: 'audio/007-khaa.mp3' },
      { id: 'daal',  letter: 'د', audio: 'audio/008-dal.mp3' },
      { id: 'dhaal', letter: 'ذ', audio: 'audio/009-dhal.mp3' },
      { id: 'raa',   letter: 'ر', audio: 'audio/010-raa.mp3' },
      { id: 'zaay',  letter: 'ز', audio: 'audio/011-zaa.mp3' },
      { id: 'seen',  letter: 'س', audio: 'audio/012-seen.mp3' },
      { id: 'sheen', letter: 'ش', audio: 'audio/013-sheen.mp3' },
      { id: 'saad',  letter: 'ص', audio: 'audio/014-saad.mp3' },
      { id: 'daad',  letter: 'ض', audio: 'audio/015-dhaad.mp3' },
      { id: 'taa2',  letter: 'ط', audio: 'audio/016-toa.mp3' },
      { id: 'zaa',   letter: 'ظ', audio: 'audio/017-dhaa.mp3' },
      { id: 'ayn',   letter: 'ع', audio: 'audio/018-ayn.mp3' },
      { id: 'ghayn', letter: 'غ', audio: 'audio/019-ghayn.mp3' },
      { id: 'faa',   letter: 'ف', audio: 'audio/020-faa.mp3' },
      { id: 'qaaf',  letter: 'ق', audio: 'audio/021-qaaf.mp3' },
      { id: 'kaaf',  letter: 'ك', audio: 'audio/022-kaaf.mp3' },
      { id: 'laam',  letter: 'ل', audio: 'audio/023-laam.mp3' },
      { id: 'meem',  letter: 'م', audio: 'audio/024-meem.mp3' },
      { id: 'noon',  letter: 'ن', audio: 'audio/025-noon.mp3' },
      { id: 'haa2',  letter: 'ه', audio: 'audio/027-ha.mp3' },
      { id: 'waaw',  letter: 'و', audio: 'audio/026-waw.mp3' },
      { id: 'yaa',   letter: 'ي', audio: 'audio/029-yaa.mp3' },
      { id: 'hamza', letter: 'ء', audio: 'audio/028-hamza.mp3' }
    ];

    const QUESTIONS_PER_ROUND = 10;

    let quizPool = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentTarget = null;
    let isLocked = false;

    const audioPlayer = document.getElementById('audio-player');
    const listenBtn = document.getElementById('listen-btn');
    const wavesContainer = document.getElementById('waves-container');
    const optionsContainer = document.getElementById('options-container');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    
    const startBlock = document.getElementById('start-block');
    const quizBlock = document.getElementById('quiz-block');
    const resultBlock = document.getElementById('result-block');
    
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScore = document.getElementById('final-score');
    const resultMessage = document.getElementById('result-message');

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setAudioPlayingState(isPlaying) {
      if (isPlaying) {
        wavesContainer.classList.add('playing');
      } else {
        wavesContainer.classList.remove('playing');
      }
    }

    function playTargetSound() {
      if (!currentTarget || !currentTarget.audio) return;

      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      audioPlayer.src = currentTarget.audio;

      setAudioPlayingState(true);

      const playPromise = audioPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          setAudioPlayingState(false);
          console.warn("Воспроизведение ожидает действия пользователя:", error);
        });
      }
    }

    audioPlayer.onended = () => setAudioPlayingState(false);
    audioPlayer.onerror = () => {
      setAudioPlayingState(false);
      console.error("Ошибка загрузки звука:", audioPlayer.src);
    };

    listenBtn.addEventListener('click', playTargetSound);

    function startQuiz() {
      if (AUDIO_DATABASE.length < 4) {
        alert('В базе должно быть минимум 4 буквы для формирования вариантов ответа.');
        return;
      }

      score = 0;
      currentQuestionIndex = 0;
      
      const count = Math.min(QUESTIONS_PER_ROUND, AUDIO_DATABASE.length);
      quizPool = shuffleArray(AUDIO_DATABASE).slice(0, count);

      startBlock.classList.add('hidden');
      resultBlock.classList.add('hidden');
      quizBlock.classList.remove('hidden');

      displayQuestion();
    }

    function displayQuestion() {
      isLocked = false;
      currentTarget = quizPool[currentQuestionIndex];

      questionCounter.textContent = `Вопрос ${currentQuestionIndex + 1}/${quizPool.length}`;
      scoreCounter.textContent = `Очки: ${score}`;
      progressBar.style.width = `${(currentQuestionIndex / quizPool.length) * 100}%`;

      const otherLetters = AUDIO_DATABASE.filter(item => item.id !== currentTarget.id);
      const distractors = shuffleArray(otherLetters).slice(0, 3);
      const choices = shuffleArray([currentTarget, ...distractors]);

      optionsContainer.innerHTML = '';
      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice.letter;
        btn.setAttribute('aria-label', `Вариант: буква ${choice.letter}`);
        btn.onclick = () => onSelectChoice(choice, btn);
        optionsContainer.appendChild(btn);
      });

      playTargetSound();
    }

    function onSelectChoice(selected, buttonElement) {
      if (isLocked) return;
      isLocked = true;

      const buttons = optionsContainer.querySelectorAll('.option-btn');
      const isCorrect = selected.id === currentTarget.id;

      if (isCorrect) {
        buttonElement.classList.add('correct');
        score++;
        scoreCounter.textContent = `Очки: ${score}`;
      } else {
        buttonElement.classList.add('wrong');
        buttons.forEach(btn => {
          if (btn.textContent === currentTarget.letter) {
            btn.classList.add('correct');
          }
        });
      }

      buttons.forEach(btn => btn.disabled = true);

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizPool.length) {
          displayQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      progressBar.style.width = '100%';
      quizBlock.classList.add('hidden');
      resultBlock.classList.remove('hidden');

      finalScore.textContent = `${score} / ${quizPool.length}`;
      
      const ratio = score / quizPool.length;
      if (ratio === 1) {
        resultMessage.textContent = 'Превосходный результат! Все звуки определены идеально.';
      } else if (ratio >= 0.7) {
        resultMessage.textContent = 'Отличный слух! Очень высокая точность распознавания.';
      } else {
        resultMessage.textContent = 'Хорошая попытка! Попробуйте пройти ещё раз для закрепления.';
      }
    }

    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', startQuiz);
  </script>
</body>
</html>
