<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Викторина: Арабский алфавит на слух</title>
  
  <!-- VK Bridge SDK -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060913;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-highlight: rgba(255, 255, 255, 0.05);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.4);
      --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --btn-surface: rgba(255, 255, 255, 0.04);
      --btn-surface-hover: rgba(255, 255, 255, 0.08);
      --btn-border: rgba(255, 255, 255, 0.1);
      --success-surface: rgba(34, 197, 94, 0.16);
      --success-border: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.35);
      --error-surface: rgba(239, 68, 68, 0.16);
      --error-border: #ef4444;
      --error-glow: rgba(239, 68, 68, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: max(clamp(8px, 2vh, 16px), env(safe-area-inset-top));
      padding-bottom: max(clamp(8px, 2vh, 16px), env(safe-area-inset-bottom));
      padding-left: max(clamp(8px, 2vh, 16px), env(safe-area-inset-left));
      padding-right: max(clamp(8px, 2vh, 16px), env(safe-area-inset-right));
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    .glow-blob {
      position: fixed;
      width: clamp(240px, 45vw, 360px);
      height: clamp(240px, 45vw, 360px);
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      top: 2%;
      left: 50%;
      transform: translateX(-50%);
    }
    .blob-2 {
      background: radial-gradient(circle, #4f46e5, transparent 70%);
      bottom: 2%;
      right: 5%;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: calc(100dvh - clamp(16px, 3vh, 32px));
      min-height: min(560px, calc(100dvh - 16px));
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: clamp(24px, 5vw, 36px);
      padding: clamp(16px, 3vh, 28px) clamp(16px, 4vw, 24px);
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.85),
        0 0 0 1px var(--card-highlight) inset;
      position: relative;
      z-index: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .app-container::-webkit-scrollbar {
      display: none;
    }

    .screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      flex: 1;
      min-height: 0;
      justify-content: space-between;
      animation: fadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #quiz-block {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: clamp(6px, 1.4vh, 12px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hidden {
      display: none !important;
    }

    /* Стартовый экран */
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 4px 6px;
    }

    .start-badge-wrapper {
      position: relative;
      margin-bottom: clamp(14px, 2.8vh, 24px);
    }

    .start-icon-box {
      width: clamp(74px, 11vh, 92px);
      height: clamp(74px, 11vh, 92px);
      border-radius: clamp(20px, 3.2vh, 28px);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(37, 99, 235, 0.1));
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(56, 189, 248, 0.2) inset;
      position: relative;
    }

    .start-arabic-char {
      font-family: 'Amiri', serif;
      font-size: clamp(2.4rem, 4.8vh, 3.2rem);
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      transform: translateY(-2px);
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
    }

    .start-sound-tag {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: clamp(26px, 3.8vh, 32px);
      height: clamp(26px, 3.8vh, 32px);
      background: #0f172a;
      border: 1.5px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .start-sound-tag svg {
      width: clamp(13px, 1.8vh, 16px);
      height: clamp(13px, 1.8vh, 16px);
      fill: var(--primary);
    }

    .start-title {
      font-size: clamp(1.35rem, 2.6vh, 1.65rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: clamp(6px, 1.2vh, 10px);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .start-desc {
      font-size: clamp(0.85rem, 1.5vh, 0.95rem);
      line-height: 1.45;
      color: var(--text-sub);
      max-width: 300px;
      margin-bottom: clamp(14px, 2.5vh, 22px);
      font-weight: 500;
    }

    .start-chips {
      display: flex;
      gap: 8px;
      margin-bottom: clamp(16px, 3vh, 26px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .start-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: clamp(4px, 0.8vh, 6px) clamp(8px, 1.8vw, 12px);
      border-radius: 999px;
      font-size: clamp(0.72rem, 1.2vh, 0.78rem);
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .start-chip.active {
      color: var(--primary);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
    }

    .primary-btn {
      width: 100%;
      max-width: 270px;
      background: var(--primary-gradient);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: clamp(14px, 2.5vh, 18px);
      padding: clamp(12px, 2vh, 16px) clamp(18px, 3vw, 24px);
      font-size: clamp(0.95rem, 1.6vh, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--primary-glow);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .primary-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.55);
    }

    .primary-btn:active {
      transform: scale(0.97);
    }

    /* Экран викторины */
    .header {
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vh, 12px);
      flex-shrink: 0;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .counter-pill {
      font-size: clamp(0.72rem, 1.3vh, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: clamp(4px, 0.7vh, 6px) clamp(10px, 2vw, 14px);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      color: var(--primary);
      font-size: clamp(0.75rem, 1.3vh, 0.85rem);
      font-weight: 700;
      padding: clamp(4px, 0.7vh, 6px) clamp(10px, 2vw, 14px);
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .score-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .progress-track {
      width: 100%;
      height: clamp(4px, 0.7vh, 6px);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
      border-radius: 999px;
      box-shadow: 0 0 12px var(--primary-glow);
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .audio-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
      flex-shrink: 0;
      min-height: 0;
      padding: clamp(4px, 1vh, 8px) 0 0 0;
      margin-top: clamp(20px, 3.5vh, 36px);
      margin-bottom: auto;
    }

    .waves-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(100px, 16vh, 136px);
      height: clamp(100px, 16vh, 136px);
      flex-shrink: 0;
    }

    .wave-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.25);
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    .playing .wave-ring:nth-child(1) {
      animation: ripple 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }
    .playing .wave-ring:nth-child(2) {
      animation: ripple 1.8s infinite cubic-bezier(0, 0.2, 0.8, 1) 0.6s;
    }

    @keyframes ripple {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .listen-btn {
      width: clamp(68px, 11vh, 88px);
      height: clamp(68px, 11vh, 88px);
      border-radius: 50%;
      background: var(--primary-gradient);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px var(--primary-glow);
      transition: all 0.22s ease;
      z-index: 2;
    }

    .listen-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.55);
    }

    .listen-btn:active {
      transform: scale(0.93);
    }

    .listen-btn svg {
      width: clamp(28px, 4.4vh, 35px);
      height: clamp(28px, 4.4vh, 35px);
      fill: currentColor;
    }

    .listen-hint {
      margin-top: clamp(8px, 1.6vh, 14px);
      margin-bottom: clamp(8px, 1.8vh, 18px);
      font-size: clamp(0.74rem, 1.3vh, 0.84rem);
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.2px;
      line-height: 1.2;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(10px, 1.8vh, 16px);
      width: 100%;
      max-width: 380px;
      margin: auto auto;
      align-content: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-btn {
      aspect-ratio: 1 / 1;
      width: 100%;
      max-height: clamp(84px, 13vh, 132px);
      background: var(--btn-surface);
      border: 1px solid var(--btn-border);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: clamp(16px, 2.6vh, 24px);
      color: var(--text-main);
      font-family: 'Amiri', serif;
      font-size: clamp(2.3rem, 4.6vh, 3.2rem);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      direction: rtl;
      unicode-bidi: isolate;
      padding-bottom: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .option-btn:hover:not(:disabled) {
      background: var(--btn-surface-hover);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.96) translateY(0);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: var(--success-surface) !important;
      border-color: var(--success-border) !important;
      color: var(--success-border) !important;
      box-shadow: 0 0 22px var(--success-glow) !important;
      transform: scale(1.02);
    }

    .option-btn.wrong {
      background: var(--error-surface) !important;
      border-color: var(--error-border) !important;
      color: var(--error-border) !important;
      box-shadow: 0 0 22px var(--error-glow) !important;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (max-height: 660px) {
      body {
        padding: 6px;
      }
      .app-container {
        border-radius: 20px;
        padding: 14px 14px;
        min-height: calc(100dvh - 12px);
      }
      .start-desc {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .audio-section {
        padding: 2px 0;
      }
      .option-btn {
        aspect-ratio: auto;
        height: clamp(66px, 11.5vh, 82px);
        font-size: clamp(2rem, 4vh, 2.5rem);
      }
    }

    @media (min-width: 640px) and (min-height: 720px) {
      .app-container {
        max-width: 460px;
        height: 680px;
        padding: 30px 28px;
      }
      .listen-hint {
        margin-bottom: 20px;
      }
      .options-grid {
        gap: 16px;
      }
      .option-btn {
        height: 125px;
        font-size: 3.2rem;
      }
    }

    /* Экран результатов */
    .result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 12px 6px;
    }

    .result-score {
      font-size: clamp(2.8rem, 6vh, 3.8rem);
      font-weight: 800;
      color: var(--primary);
      margin: clamp(4px, 1vh, 8px) 0 clamp(8px, 1.8vh, 12px) 0;
      letter-spacing: -1.5px;
      text-shadow: 0 0 24px var(--primary-glow);
    }
  </style>
</head>
<body>

  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="app-container">
    
    <!-- 1. Стартовый экран -->
    <div class="screen start-screen" id="start-block">
      <div class="start-badge-wrapper">
        <div class="start-icon-box">
          <span class="start-arabic-char">ض</span>
        </div>
        <div class="start-sound-tag" title="Аудиовикторина">
          <svg viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
      </div>

      <h1 class="start-title">Арабская фонетика</h1>
      <p class="start-desc">Слушайте правильное произношение букв и определяйте соответствующий символ.</p>
      
      <div class="start-chips">
        <span class="start-chip active">29 букв</span>
        <span class="start-chip">Аудио HD</span>
        <span class="start-chip">4 варианта</span>
      </div>

      <button class="primary-btn" id="start-btn">Начать викторину</button>
    </div>

    <!-- 2. Викторина -->
    <div class="screen hidden" id="quiz-block">
      <div class="header">
        <div class="top-bar">
          <span class="counter-pill" id="question-counter">Вопрос 1/10</span>
          <div class="score-badge">
            <div class="score-dot"></div>
            <span id="score-counter">Очки: 0</span>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="audio-section">
        <div class="waves-container" id="waves-container">
          <div class="wave-ring"></div>
          <div class="wave-ring"></div>
          <button class="listen-btn" id="listen-btn" aria-label="Прослушать произношение буквы" title="Воспроизвести звук">
            <svg viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
        </div>
        <div class="listen-hint">Нажмите для повтора звука</div>
      </div>

      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 3. Экран результатов -->
    <div class="screen result-screen hidden" id="result-block">
      <h2 style="font-size: clamp(1.3rem, 2.5vh, 1.6rem); font-weight: 800;">Раунд завершён</h2>
      <p style="color: var(--text-muted); margin-top: 6px; font-size: clamp(0.85rem, 1.4vh, 0.95rem);">Количество точных ответов:</p>
      <div class="result-score" id="final-score">0 / 10</div>
      <p id="result-message" style="color: var(--text-sub); font-size: clamp(0.85rem, 1.4vh, 0.95rem); max-width: 280px;"></p>
      <button class="primary-btn" id="restart-btn" style="margin-top: clamp(14px, 2.8vh, 24px);">Пройти ещё раз</button>
    </div>

  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script>
    /* ========================================================================
       ИНИЦИАЛИЗАЦИЯ VK MINI APPS
    ======================================================================== */
    if (window.vkBridge) {
      window.vkBridge.subscribe((event) => {
        if (!event.detail) return;
        const { type, data } = event.detail;
        if (type === 'VKWebAppUpdateConfig') {
          // Обработка темы или отступов при необходимости
        }
      });

      window.vkBridge.send('VKWebAppInit')
        .then(() => {
          console.log('VK Mini App успешно инициализирован');
        })
        .catch((error) => {
          console.warn('Ошибка инициализации VK Bridge:', error);
        });
    }

    /* ========================================================================
       БАЗА БУКВ И АУДИОФАЙЛОВ
    ======================================================================== */
    const AUDIO_DATABASE = [
      { id: 'alif',  letter: 'ا', nameAr: 'أَلِف', audio: ['audio/001-alif.mp3'] },
      { id: 'baa',   letter: 'ب', nameAr: 'بَاء', audio: ['audio/002-baa.mp3', 'audio/002-baa.mp3'] },
      { id: 'taa',   letter: 'ت', nameAr: 'تَاء', audio: ['audio/003-taa.mp3', 'audio/003-ta.mp3'] },
      { id: 'thaa',  letter: 'ث', nameAr: 'ثَاء', audio: ['audio/004-thaa.mp3', 'audio/004-thaa.mp3'] },
      { id: 'jeem',  letter: 'ج', nameAr: 'جِيم', audio: ['audio/005-jeem.mp3', 'audio/005-jim.mp3'] },
      { id: 'haa',   letter: 'ح', nameAr: 'حَاء', audio: ['audio/006-haa.mp3', 'audio/006-ha.mp3'] },
      { id: 'khaa',  letter: 'خ', nameAr: 'خَاء', audio: ['audio/007-khaa.mp3', 'audio/007-kha.mp3'] },
      { id: 'daal',  letter: 'د', nameAr: 'دَال', audio: ['audio/008-dal.mp3', 'audio/008-daal.mp3'] },
      { id: 'dhaal', letter: 'ذ', nameAr: 'ذَال', audio: ['audio/009-zal.mp3', 'audio/009-dhaal.mp3'] },
      { id: 'raa',   letter: 'ر', nameAr: 'رَاء', audio: ['audio/010-raa.mp3', 'audio/010-ra.mp3'] },
      { id: 'zaay',  letter: 'ز', nameAr: 'زَاي', audio: ['audio/011-zaa.mp3', 'audio/011-zay.mp3', 'audio/011-za.mp3'] },
      { id: 'seen',  letter: 'س', nameAr: 'سِين', audio: ['audio/012-seen.mp3', 'audio/012-sin.mp3'] },
      { id: 'sheen', letter: 'ش', nameAr: 'شِين', audio: ['audio/013-sheen.mp3', 'audio/013-shin.mp3'] },
      { id: 'saad',  letter: 'ص', nameAr: 'صَاد', audio: ['audio/014-sood.mp3', 'audio/014-sad.mp3'] },
      { id: 'daad',  letter: 'ض', nameAr: 'ضَاد', audio: ['audio/015-dood.mp3', 'audio/015-daad.mp3', 'audio/015-dad.mp3'] },
      { id: 'taa2',  letter: 'ط', nameAr: 'طَاء', audio: ['audio/016-toa.mp3', 'audio/016-taa.mp3', 'audio/016-ta.mp3'] },
      { id: 'zaa',   letter: 'ظ', nameAr: 'ظَاء', audio: ['audio/017-zoa.mp3', 'audio/017-zaa.mp3', 'audio/017-za.mp3'] },
      { id: 'ayn',   letter: 'ع', nameAr: 'عَيْن', audio: ['audio/018-ayn.mp3', 'audio/018-ain.mp3'] },
      { id: 'ghayn', letter: 'غ', nameAr: 'غَيْن', audio: ['audio/019-ghayn.mp3', 'audio/019-ghain.mp3'] },
      { id: 'faa',   letter: 'ف', nameAr: 'فَاء', audio: ['audio/020-faa.mp3', 'audio/020-fa.mp3'] },
      { id: 'qaaf',  letter: 'ق', nameAr: 'قَاف', audio: ['audio/021-qaaf.mp3', 'audio/021-qaf.mp3'] },
      { id: 'kaaf',  letter: 'ك', nameAr: 'كَاف', audio: ['audio/022-kaaf.mp3', 'audio/022-kaf.mp3'] },
      { id: 'laam',  letter: 'ل', nameAr: 'لَام', audio: ['audio/023-laam.mp3', 'audio/023-lam.mp3'] },
      { id: 'meem',  letter: 'م', nameAr: 'مِيم', audio: ['audio/024-meem.mp3', 'audio/024-mim.mp3'] },
      { id: 'noon',  letter: 'ن', nameAr: 'نُون', audio: ['audio/025-nuun.mp3', 'audio/025-nun.mp3'] },
      { id: 'waaw',  letter: 'و', nameAr: 'وَاو', audio: ['audio/026-waw.mp3', 'audio/026-waaw.mp3'] },
      { id: 'haa2',  letter: 'ه', nameAr: 'هَاء', audio: ['audio/027-ha.mp3', 'audio/027-haa.mp3'] },
      { id: 'yaa',   letter: 'ي', nameAr: 'يَاء', audio: ['audio/028-yaa.mp3', 'audio/029-ya.mp3'] }
      /*{ id: 'hamza', letter: 'ء', nameAr: 'هَمْزَة', audio: ['audio/029-hamza.mp3'] }*/
    ];

    const QUESTIONS_PER_ROUND = 10;

    let quizPool = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentTarget = null;
    let isLocked = false;
    let currentAudioIndex = 0;

    const audioPlayer = document.getElementById('audio-player');
    const listenBtn = document.getElementById('listen-btn');
    const wavesContainer = document.getElementById('waves-container');
    const optionsContainer = document.getElementById('options-container');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    
    const startBlock = document.getElementById('start-block');
    const quizBlock = document.getElementById('quiz-block');
    const resultBlock = document.getElementById('result-block');
    
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScore = document.getElementById('final-score');
    const resultMessage = document.getElementById('result-message');

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setAudioPlayingState(isPlaying) {
      if (isPlaying) {
        wavesContainer.classList.add('playing');
      } else {
        wavesContainer.classList.remove('playing');
      }
    }

    function stopAllAudio() {
      audioPlayer.pause();
      audioPlayer.currentTime = 0;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setAudioPlayingState(false);
    }

    function playSpeechFallback() {
      if (!('speechSynthesis' in window) || !currentTarget) {
        setAudioPlayingState(false);
        return;
      }

      window.speechSynthesis.cancel();
      const textToSpeak = currentTarget.nameAr || currentTarget.letter;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.85;

      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
      if (arVoice) {
        utterance.voice = arVoice;
      }

      utterance.onstart = () => setAudioPlayingState(true);
      utterance.onend = () => setAudioPlayingState(false);
      utterance.onerror = () => setAudioPlayingState(false);

      window.speechSynthesis.speak(utterance);
    }

    function tryNextAudioSource() {
      if (!currentTarget) {
        setAudioPlayingState(false);
        return;
      }

      const sources = Array.isArray(currentTarget.audio) 
        ? currentTarget.audio 
        : [currentTarget.audio];

      if (currentAudioIndex < sources.length) {
        const nextSrc = sources[currentAudioIndex];
        currentAudioIndex++;
        audioPlayer.src = nextSrc;
        setAudioPlayingState(true);

        const playPromise = audioPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch((err) => {
            // Если браузер заблокировал autoplay — не крутим волны попусту
            if (err.name === 'NotAllowedError') {
              setAudioPlayingState(false);
            } else {
              tryNextAudioSource();
            }
          });
        }
      } else {
        playSpeechFallback();
      }
    }

    function playTargetSound() {
      if (!currentTarget) return;

      stopAllAudio();
      currentAudioIndex = 0;
      tryNextAudioSource();
    }

    audioPlayer.onended = () => setAudioPlayingState(false);
    audioPlayer.onerror = () => {
      tryNextAudioSource();
    };

    listenBtn.addEventListener('click', playTargetSound);

    function startQuiz() {
      if (AUDIO_DATABASE.length < 4) {
        console.warn('В базе должно быть минимум 4 буквы для формирования вариантов ответа.');
        return;
      }

      score = 0;
      currentQuestionIndex = 0;
      
      const count = Math.min(QUESTIONS_PER_ROUND, AUDIO_DATABASE.length);
      quizPool = shuffleArray(AUDIO_DATABASE).slice(0, count);

      startBlock.classList.add('hidden');
      resultBlock.classList.add('hidden');
      quizBlock.classList.remove('hidden');

      displayQuestion();
    }

    function displayQuestion() {
      stopAllAudio();
      isLocked = false;
      currentTarget = quizPool[currentQuestionIndex];

      questionCounter.textContent = `Вопрос ${currentQuestionIndex + 1}/${quizPool.length}`;
      scoreCounter.textContent = `Очки: ${score}`;
      progressBar.style.width = `${(currentQuestionIndex / quizPool.length) * 100}%`;

      const otherLetters = AUDIO_DATABASE.filter(item => item.id !== currentTarget.id);
      const distractors = shuffleArray(otherLetters).slice(0, 3);
      const choices = shuffleArray([currentTarget, ...distractors]);

      optionsContainer.innerHTML = '';
      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice.letter;
        btn.dataset.id = choice.id;
        btn.setAttribute('aria-label', `Вариант: буква ${choice.letter}`);
        btn.onclick = () => onSelectChoice(choice, btn);
        optionsContainer.appendChild(btn);
      });

      playTargetSound();
    }

    function onSelectChoice(selected, buttonElement) {
      if (isLocked) return;
      isLocked = true;
      stopAllAudio();

      const buttons = optionsContainer.querySelectorAll('.option-btn');
      const isCorrect = selected.id === currentTarget.id;

      if (isCorrect) {
        buttonElement.classList.add('correct');
        score++;
        scoreCounter.textContent = `Очки: ${score}`;
      } else {
        buttonElement.classList.add('wrong');
        buttons.forEach(btn => {
          if (btn.dataset.id === currentTarget.id) {
            btn.classList.add('correct');
          }
        });
      }

      buttons.forEach(btn => btn.disabled = true);

      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizPool.length) {
          displayQuestion();
        } else {
          showResult();
        }
      }, 1000);
    }

    function showResult() {
      stopAllAudio();
      progressBar.style.width = '100%';
      quizBlock.classList.add('hidden');
      resultBlock.classList.remove('hidden');

      finalScore.textContent = `${score} / ${quizPool.length}`;
      
      const ratio = score / quizPool.length;
      if (ratio === 1) {
        resultMessage.textContent = 'Превосходный результат! Все звуки определены идеально.';
      } else if (ratio >= 0.7) {
        resultMessage.textContent = 'Отличный слух! Очень высокая точность распознавания.';
      } else {
        resultMessage.textContent = 'Хорошая попытка! Попробуйте пройти ещё раз для закрепления.';
      }
    }

    startBtn.addEventListener('click', startQuiz);
    restartBtn.addEventListener('click', startQuiz);
  </script>
</body>
</html>
